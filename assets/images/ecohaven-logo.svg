<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86450D"/>
      <stop offset="50%" stop-color="#A45D25"/>
      <stop offset="100%" stop-color="#5E2C05"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#597659"/>
      <stop offset="100%" stop-color="#2D4A2E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B"/>
      <stop offset="100%" stop-color="#C59B4E"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" flood-color="#301400"/>
    </filter>
  </defs>

  <!-- ICON / EMBLEM (Left: 0-90) -->
  <g transform="translate(10, 10)" filter="url(#subtleShadow)">
    <!-- Haven Roofline Canopy -->
    <path d="M40 6 L72 26 L66 31 L40 14 L14 31 L8 26 Z" fill="url(#woodGrad)"/>
    
    <!-- 4 Interlocking TetraTable Chair Elements (Circular Quadrants) -->
    <!-- Top-Left Chair -->
    <path d="M22 34 A 18 18 0 0 1 38 20 L38 34 Z" fill="url(#woodGrad)" opacity="0.9"/>
    <!-- Top-Right Chair -->
    <path d="M42 20 A 18 18 0 0 1 58 34 L42 34 Z" fill="url(#woodGrad)" opacity="0.95"/>
    <!-- Bottom-Left Chair -->
    <path d="M38 38 L22 38 A 18 18 0 0 0 38 54 Z" fill="url(#woodGrad)" opacity="0.95"/>
    <!-- Bottom-Right Chair -->
    <path d="M42 38 L58 38 A 18 18 0 0 1 42 54 Z" fill="url(#woodGrad)" opacity="0.9"/>

    <!-- Central Organic Eco Leaf Accent -->
    <path d="M40 25 C47 31 46 41 40 47 C34 41 33 31 40 25 Z" fill="url(#leafGrad)"/>
    <path d="M40 27 L40 45" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

    <!-- Circular Sturdy Base Ring -->
    <circle cx="40" cy="62" r="7" stroke="url(#goldGrad)" stroke-width="2.5" fill="none"/>
    <rect x="20" y="70" width="40" height="3" rx="1.5" fill="url(#woodGrad)"/>
  </g>

  <!-- BRAND TYPOGRAPHY (Right: 105-420) -->
  <g transform="translate(105, 18)">
    <!-- Wordmark -->
    <text x="0" y="38" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="-0.02em" fill="#26190F">
      Eco<tspan fill="#86450D">Haven</tspan>
    </text>
    <!-- Subtitle / Tagline -->
    <text x="2" y="58" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.22em" fill="#7D562D" text-transform="uppercase">
      FURNITURE • CANDABA JOINERY
    </text>
    <!-- Subtle Golden Accent Line -->
    <line x1="2" y1="67" x2="280" y2="67" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>

