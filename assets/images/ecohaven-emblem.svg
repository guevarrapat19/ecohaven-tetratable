<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="woodGradSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86450D"/>
      <stop offset="50%" stop-color="#A45D25"/>
      <stop offset="100%" stop-color="#5E2C05"/>
    </linearGradient>
    <linearGradient id="leafGradSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#597659"/>
      <stop offset="100%" stop-color="#2D4A2E"/>
    </linearGradient>
    <linearGradient id="goldGradSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C07B"/>
      <stop offset="100%" stop-color="#C59B4E"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18" flood-color="#301400"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="#FFF8F5"/>
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="url(#goldGradSquare)" stroke-width="1.5" fill="none" opacity="0.6"/>

  <g transform="translate(10, 10)" filter="url(#badgeShadow)">
    <!-- Haven Roofline Canopy -->
    <path d="M40 8 L72 28 L66 33 L40 16 L14 33 L8 28 Z" fill="url(#woodGradSquare)"/>
    
    <!-- 4 Interlocking TetraTable Chair Elements -->
    <path d="M22 36 A 18 18 0 0 1 38 22 L38 36 Z" fill="url(#woodGradSquare)" opacity="0.9"/>
    <path d="M42 22 A 18 18 0 0 1 58 36 L42 36 Z" fill="url(#woodGradSquare)" opacity="0.95"/>
    <path d="M38 40 L22 40 A 18 18 0 0 0 38 56 Z" fill="url(#woodGradSquare)" opacity="0.95"/>
    <path d="M42 40 L58 40 A 18 18 0 0 1 42 56 Z" fill="url(#woodGradSquare)" opacity="0.9"/>

    <!-- Central Organic Eco Leaf Accent -->
    <path d="M40 27 C47 33 46 43 40 49 C34 43 33 33 40 27 Z" fill="url(#leafGradSquare)"/>
    <path d="M40 29 L40 47" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

    <!-- Circular Sturdy Base Ring -->
    <circle cx="40" cy="64" r="7" stroke="url(#goldGradSquare)" stroke-width="2.5" fill="none"/>
    <rect x="20" y="72" width="40" height="3.5" rx="1.75" fill="url(#woodGradSquare)"/>
  </g>
</svg>

